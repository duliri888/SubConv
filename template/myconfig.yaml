HEAD:
  mixed-port: 7890
  allow-lan: true
  mode: rule
  log-level: info
  external-controller: :9090

dns:
  enable: true
  listen: 0.0.0.0:1053
  default-nameserver:
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

TEST_URL: https://www.gstatic.com/generate_204

# ==================== 全局节点强力过滤（关键！） ====================
CUSTOM_PROXY_GROUP:
- name: 🚀 节点选择
  type: select
  regex: "(?i)vless|trojan|ss|SS|shadowsocks"
  exclude: "vision|xtls-rprx|reality|Reality|商宽|住宅|early-data|max-early-data|anytls|AnyTLS|ANYTLS|any-tls|Any-TLS|vmess|VMess|Hysteria2|Juicity"

- name: ♻️ 自动选择
  type: url-test

- name: 🚀 手动切换
  type: select
  manual: true

- name: 🇭🇰 香港
  type: url-test
  regex: "(?i)港|HK|Hong Kong"

- name: 🇯🇵 日本
  type: url-test
  regex: "(?i)日|JP|Japan|Tokyo"

- name: 🇸🇬 新加坡
  type: url-test
  regex: "(?i)新|SG|Singapore"

- name: 🇺🇸 美国
  type: url-test
  regex: "(?i)美|US|USA|United States"

RULESET:
- - 🚀 节点选择
  - '[]MATCH'
